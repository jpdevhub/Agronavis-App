<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<style>
  path {
    stroke: currentColor;
    stroke-width: 1px;
    stroke-dasharray: 5000;
    stroke-dashoffset: 5000;
    fill-opacity: 0;
    animation: draw 3s cubic-bezier(0.25, 1, 0.5, 1) forwards, fadeFill 1.5s 2s ease-in forwards;
  }
  @keyframes draw {
    100% {
      stroke-dashoffset: 0;
    }
  }
  @keyframes fadeFill {
    100% {
      fill-opacity: 1;
      stroke-opacity: 0;
    }
  }
  /* Stagger animation based on elements to give a "drawing sequentially" look */
  path:nth-child(1) { animation-delay: 0s, 2s; }
  path:nth-child(2) { animation-delay: 0.1s, 2.1s; }
  path:nth-child(3) { animation-delay: 0.2s, 2.2s; }
  path:nth-child(4) { animation-delay: 0.3s, 2.3s; }
  path:nth-child(5) { animation-delay: 0.4s, 2.4s; }
  path:nth-child(6) { animation-delay: 0.5s, 2.5s; }
</style>
