name: EAS Build (Play Store AAB)

# The APK for side-loading is built by android-apk.yml on GitHub's runners, for
# free. This workflow exists for Play Store submissions, which want an AAB and
# EAS's managed credentials. Run it by hand when you are shipping to Play.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options: [preview, production]

jobs:
  build:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: eas build --platform android --non-interactive --profile ${{ inputs.profile || 'production' }}
        env:
          # app.config.js falls back to process.env when the root .env is absent,
          # which is always the case in CI.
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
