name: EAS Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: EAS Build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # Push secrets into Expo's environment so the EAS build servers receive them.
      # --force overwrites any existing value silently (safe for CI).
      - name: Push env vars to EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:create \
            --name EXPO_PUBLIC_SUPABASE_URL \
            --value "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" \
            --environment production \
            --visibility plaintext \
            --type string \
            --force --non-interactive || true

          eas env:create \
            --name EXPO_PUBLIC_SUPABASE_ANON_KEY \
            --value "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            --environment production \
            --visibility sensitive \
            --type string \
            --force --non-interactive || true

          eas env:create \
            --name EXPO_PUBLIC_API_URL \
            --value "${{ secrets.EXPO_PUBLIC_API_URL }}" \
            --environment production \
            --visibility plaintext \
            --type string \
            --force --non-interactive || true

          eas env:create \
            --name EXPO_PUBLIC_OWM_KEY \
            --value "${{ secrets.EXPO_PUBLIC_OWM_KEY }}" \
            --environment production \
            --visibility sensitive \
            --type string \
            --force --non-interactive || true

      - name: EAS Build
        working-directory: apps/mobile
        run: eas build --platform android --non-interactive --profile production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
