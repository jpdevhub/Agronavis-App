name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # onnxruntime-node ships the linux-x64 CPU binaries inside the package; its
  # postinstall only fetches the CUDA ones on top. Runners have no GPU and the
  # scanner pins the CPU provider, so that download buys nothing — and it is
  # what was timing out and failing this workflow.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tests/setup.ts supplies the environment the API validates at import
      # time, so no secrets are needed here.
      - name: Test
        run: npm test

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build --workspace=@agronavis/backend
