name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # onnxruntime-node ships the linux-x64 CPU binaries inside the package; its
  # postinstall only fetches the CUDA ones on top. Runners have no GPU and the
  # scanner pins the CPU provider, so that download buys nothing — and it is
  # what was timing out and failing this workflow.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # tests/setup.ts supplies the environment the API validates at import
      # time, so no secrets are needed here.
      - name: Test
        run: npm test

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build --workspace=@agronavis/backend

      # Compiling is not the same as being loadable. A runtime import of a
      # package whose `main` points at TypeScript source compiled perfectly
      # and then would not boot, and this job reported success while the
      # deploy it gated crash-looped.
      #
      # This loads the whole module graph — every route, service and schema —
      # which is where that import sat. It deliberately stops short of
      # `server.js`, which opens a database connection: whether Supabase is
      # reachable from a CI runner says nothing about whether the build runs.
      - name: Load the built server
        env:
          NODE_ENV: production
          SUPABASE_URL: https://example.supabase.co
          # Only the shape is checked on load; nothing is ever called with it.
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-not-a-real-secret
        run: node -e "require('./backend/dist/app.js'); console.log('built server loads')"
