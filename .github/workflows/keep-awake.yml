name: Keep the API awake

# Render's free tier sleeps a web service after 15 minutes without traffic, and
# a cold start then takes 30-50 seconds — long enough that a farmer opening the
# app sees a spinner or a timeout. It also means the in-process cron never
# fires: a sleeping instance runs no jobs.
#
# This pings /health often enough that the instance never sleeps. GitHub's
# scheduler is best-effort and can run late under load, so 10 minutes is used
# rather than 14 to leave headroom.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# A late run must not stack on top of the previous one.
concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::RENDER_API_URL is not set. Add it under Settings ▸ Secrets ▸ Actions."
            exit 1
          fi

          # A waking instance can take ~50s to answer, so allow for it and retry.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 90 "$API_URL/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "awake (attempt $attempt)"
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $attempt: http=$code"
            sleep 15
          done

          echo "::error::API did not answer after 3 attempts."
          exit 1
